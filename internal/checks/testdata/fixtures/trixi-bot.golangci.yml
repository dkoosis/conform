version: "2"

run:
  modules-download-mode: vendor
  tests: true

linters:
  # bugclasses baseline floor (ccp-sbp.2, decision nug d7ea466a8172): `standard`
  # keeps golangci's own defaults (errcheck, govet, ineffassign, staticcheck,
  # unused) under this repo's richer list, so the shared floor is never below
  # them. contextcheck stays OFF — advisory only; that defect class is owned,
  # path-scoped, by the pack's forbidigo rule 5 below.
  default: standard

  enable:
    # Error handling
    - errorlint
    - nilerr
    - nilnesserr
    # rowserrcheck: floor linter — sql.Rows.Err() unchecked after iteration.
    # A no-op here (no database/sql import); carried so the floor is uniform.
    - rowserrcheck
    # NOTE: wrapcheck is deliberately OFF for now. It flags ~50 unwrapped
    # boundary errors — a real but invasive error-context policy (every os/json/
    # telegram-lib call site wrapped with "%w"). Deferred as a separate tranche
    # so the initial strict pass stays reviewable. Re-enable when wrapping the
    # boundary errors is done in one focused change.

    # Safety
    - bodyclose
    - containedctx
    - forcetypeassert
    - forbidigo
    - gosec
    - noctx
    - predeclared

    # Architecture — layer boundaries (see settings.depguard). The internal
    # graph is a clean DAG; these rules freeze the load-bearing edges so drift
    # fails the build instead of the honor system in .claude/rules/architecture.md.
    - depguard

    # Complexity
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - nestif

    # Style & correctness
    - asciicheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - inamedparam
    - intrange
    - loggercheck
    - misspell
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - reassign
    - recvcheck
    - revive
    - staticcheck    # floor linter: the SA correctness suite (a default, named)
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

    # Performance
    - perfsprint

    # Testing
    - testifylint
    - thelper
    - usetesting

  settings:
    depguard:
      # Layer contract. Each rule scopes to one package's files and denies the
      # sibling internal packages it must never import. Leaves (domain, utils)
      # depend on nothing; store & llm stay pure; transport & channel (UI-agnostic
      # plumbing) never reach up into the orchestrator (core). core is the top of
      # the DAG and is intentionally unrestricted.
      rules:
        domain-leaf:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/dkoosis/trixi-bot/internal/channel
              desc: "domain is a leaf — shared types import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/core
              desc: "domain is a leaf — shared types import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/llm
              desc: "domain is a leaf — shared types import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/scheduler
              desc: "domain is a leaf — shared types import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/store
              desc: "domain is a leaf — shared types import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/tools
              desc: "domain is a leaf — shared types import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/transport
              desc: "domain is a leaf — shared types import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/utils
              desc: "domain is a leaf — shared types import no other internal package"
        utils-leaf:
          files:
            - "**/internal/utils/**"
          deny:
            - pkg: github.com/dkoosis/trixi-bot/internal/channel
              desc: "utils is a leaf — helpers import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/core
              desc: "utils is a leaf — helpers import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/domain
              desc: "utils is a leaf — helpers import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/llm
              desc: "utils is a leaf — helpers import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/scheduler
              desc: "utils is a leaf — helpers import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/store
              desc: "utils is a leaf — helpers import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/tools
              desc: "utils is a leaf — helpers import no other internal package"
            - pkg: github.com/dkoosis/trixi-bot/internal/transport
              desc: "utils is a leaf — helpers import no other internal package"
        store-pure:
          files:
            - "**/internal/store/**"
          deny:
            - pkg: github.com/dkoosis/trixi-bot/internal/channel
              desc: "persistence stays pure — store imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/core
              desc: "persistence stays pure — store imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/llm
              desc: "persistence stays pure — store imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/scheduler
              desc: "persistence stays pure — store imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/tools
              desc: "persistence stays pure — store imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/transport
              desc: "persistence stays pure — store imports only domain (and utils)"
        llm-pure:
          files:
            - "**/internal/llm/**"
          deny:
            - pkg: github.com/dkoosis/trixi-bot/internal/channel
              desc: "provider clients stay pure — llm imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/core
              desc: "provider clients stay pure — llm imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/scheduler
              desc: "provider clients stay pure — llm imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/store
              desc: "provider clients stay pure — llm imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/tools
              desc: "provider clients stay pure — llm imports only domain (and utils)"
            - pkg: github.com/dkoosis/trixi-bot/internal/transport
              desc: "provider clients stay pure — llm imports only domain (and utils)"
        transport-no-core:
          files:
            - "**/internal/transport/**"
          deny:
            - pkg: github.com/dkoosis/trixi-bot/internal/channel
              desc: "transport is UI-agnostic plumbing — must not import core/channel/tools/llm/scheduler/store"
            - pkg: github.com/dkoosis/trixi-bot/internal/core
              desc: "transport is UI-agnostic plumbing — must not import core/channel/tools/llm/scheduler/store"
            - pkg: github.com/dkoosis/trixi-bot/internal/llm
              desc: "transport is UI-agnostic plumbing — must not import core/channel/tools/llm/scheduler/store"
            - pkg: github.com/dkoosis/trixi-bot/internal/scheduler
              desc: "transport is UI-agnostic plumbing — must not import core/channel/tools/llm/scheduler/store"
            - pkg: github.com/dkoosis/trixi-bot/internal/store
              desc: "transport is UI-agnostic plumbing — must not import core/channel/tools/llm/scheduler/store"
            - pkg: github.com/dkoosis/trixi-bot/internal/tools
              desc: "transport is UI-agnostic plumbing — must not import core/channel/tools/llm/scheduler/store"
        channel-no-core:
          files:
            - "**/internal/channel/**"
          deny:
            - pkg: github.com/dkoosis/trixi-bot/internal/core
              desc: "the transport adapter must not import the orchestrator — core owns dispatch, not the reverse"
            - pkg: github.com/dkoosis/trixi-bot/internal/llm
              desc: "channel drives transport/store/utils only — no llm/tools/scheduler reach-through"
            - pkg: github.com/dkoosis/trixi-bot/internal/scheduler
              desc: "channel drives transport/store/utils only — no llm/tools/scheduler reach-through"
            - pkg: github.com/dkoosis/trixi-bot/internal/tools
              desc: "channel drives transport/store/utils only — no llm/tools/scheduler reach-through"
    errcheck:
      # STRICT — the baseline floor's minimum list, unioned with this repo's
      # entries. Only calls whose dropped error is genuinely fine (a Close on a
      # read handle, a printer to a writer that cannot fail). No path/package
      # blanket ignores; a real unchecked error stays a finding.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    goconst:
      min-len: 4
      min-occurrences: 5
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # bugclasses pack (ccp-sbp, decision nug d7ea466a8172): the ruleguard
      # checker runs the shared machine rules for the recurring cross-repo Go
      # defect classes. Rules live in .golangci-rules/bugclasses.go — a verbatim
      # copy of the upstream pack, drift-guarded by scripts/check-pack-drift.sh.
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} = the .golangci.yml directory (golangci-lint v2). The
          # glob names ONLY bugclasses.go, so rule 2 (raw-state-write, the
          # opt-in file) stays off — trixi-bot already adopted atomicfile
          # (ccp-sbp.5), but the pack ships rule 2 off by convention.
          rules: "${base-path}/.golangci-rules/bugclasses.go"
          # Fail the run on rule-compile errors — never silently skip them.
          failOn: dsl
      disabled-checks:
        - commentFormatting
        - ifElseChain
        # hugeParam: ~12 violations, all 80-140 byte structs passed by value in
        # non-hot paths. Switching to pointers is high churn (signature ripple)
        # for zero runtime benefit in a single-user CLI.
        - hugeParam
        - appendCombine
    forbidigo:
      # bugclasses rule 5: context.Background() deep in daemon code should
      # thread the caller/shutdown ctx (strand st-47z, trixi #606,
      # trixi-bot gg-8rq.3, canapay can-x38). Path-scoped below to trixi-bot's
      # daemon packages. Types-aware so a `ctx.Background` field can't misfire.
      analyze-types: true
      forbid:
        - pattern: '^context\.Background$'
          msg: "thread the caller/shutdown ctx; context.Background belongs only at a daemon's root (main/startup)"
    cyclop:
      max-complexity: 20
    funlen:
      lines: 100
      statements: 65
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    nestif:
      min-complexity: 6
    nakedret:
      max-func-lines: 20
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: error-return
          disabled: false
        - name: dot-imports
          disabled: false
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files: relax security, complexity, context, and error-wrapping.
      - linters:
          - gosec
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
          - noctx
          - unparam
          - wrapcheck
          - forcetypeassert
        path: _test\.go
      # Tool definitions are JSON-schema tables: the repeated "string",
      # "description", "path" literals are schema keywords, not magic strings —
      # extracting them to constants hurts readability.
      - linters:
          - goconst
        path: internal/tools/
      # cmd main.go: relax complexity — wiring, not logic.
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: cmd/.*/main\.go
      # bugclasses rule 5 (forbidigo Background ban) is noise everywhere except
      # long-lived daemon packages. context.Background is legitimate at the
      # daemon's roots (cmd/*, the eval/* and gen-arch-map mains) and in tests.
      # internal/ daemon code threads the run/shutdown ctx; the handful of
      # deliberate detached/owned roots there carry a per-site //nolint.
      - linters:
          - forbidigo
        path: '(_test\.go$|(^|/)cmd/|(^|/)main\.go$|/memorytest/)'
        text: 'context\.Background'
      # The bash/exec tools intentionally run user-directed subprocesses (G204)
      # and read/write user-specified paths (G703 path traversal) — that is the
      # feature. Sandboxing is an agent-design concern, not a lint fix.
      - linters:
          - gosec
        path: internal/tools/system/
        text: "(G204|G703)"
      # G306: the agent writes files the user then reads and edits (attachments,
      # edited source, memory). 0644 is intentional, not a permissions bug.
      - linters:
          - gosec
        text: "G306"
    paths:
      - internal/llm/catalog/.*_models\.json$

formatters:
  # gofmt only — deliberately NOT goimports. This fork tracks upstream; goimports
  # regroups imports repo-wide and would conflict on every `git pull upstream`.
  enable:
    - gofmt
  exclusions:
    generated: lax
