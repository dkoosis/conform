version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  # bugclasses baseline floor (ccp-sbp.2, decision nug d7ea466a8172):
  # `standard` keeps golangci's own defaults (errcheck, govet, ineffassign,
  # staticcheck, unused) under trixi's richer config, so the shared floor is
  # never below errcheck/nilerr/rowserrcheck/noctx/staticcheck/nolintlint.
  # contextcheck is deliberately NOT enabled — advisory only (60 findings on
  # main, FP-dominated); that defect class is owned by forbidigo rule 5 below.
  default: standard
  enable:
    # Error handling
    - err113
    - errchkjson
    - errorlint
    - nilerr
    - nilnesserr
    - wrapcheck

    # Architecture
    - depguard

    # Safety
    - bodyclose
    - containedctx
    - forbidigo
    - forcetypeassert
    - gosec
    - noctx
    - predeclared
    - rowserrcheck
    - sqlclosecheck

    # Complexity
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - nestif

    # Enum & type safety
    - exhaustive
    - makezero
    - musttag
    - reassign

    # Style & correctness
    - asciicheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - grouper
    - inamedparam
    - intrange
    - iotamixing
    - loggercheck
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - recvcheck
    - revive
    - sloglint
    - staticcheck # a golangci default; named explicitly per the baseline floor
    - unconvert
    - unparam
    - unqueryvet
    - usestdlibvars
    - wastedassign

    # Performance
    - mirror
    - perfsprint

    # Testing
    - testifylint
    - thelper
    - usetesting

  disable:
    - godox
    - wsl

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintln
    goconst:
      min-len: 4          # ignore short strings ("raw", "tip") — noise in test fixtures
      min-occurrences: 5  # raised from 3 — long-tail fixture strings aren't worth extracting
      ignore-tests: true  # goconst on test fixtures is mostly noise; keep on production code
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # bugclasses pack (ccp-sbp, decision nug d7ea466a8172): the ruleguard
      # checker runs the shared machine rules for the recurring cross-repo Go
      # defect classes (rule 1 scanner-buffer, rule 4 err-substring, rule 6
      # pid-liveness). Rules live in .golangci-rules/bugclasses.go — a verbatim
      # copy of the upstream pack, drift-guarded by scripts/check-pack-drift.sh.
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} = the .golangci.yml directory (golangci-lint v2). The
          # glob names ONLY bugclasses.go, so rule 2 (raw-state-write, the
          # opt-in file) stays off until trixi moves durable state to atomicfile.
          rules: "${base-path}/.golangci-rules/bugclasses.go"
          # Fail the run on rule-compile errors — never silently skip them.
          failOn: dsl
      disabled-checks:
        - appendCombine
        - commentFormatting
        - deprecatedComment
        - hugeParam # 35 violations, all 80-400 byte structs passed by value in non-hot paths. High churn (27 signature changes, interface ripple) for zero runtime benefit in a single-user CLI.
        - ifElseChain
        - unlambda
    forbidigo:
      # bugclasses rule 5: context.Background() deep in daemon code should
      # thread the caller/shutdown ctx (strand st-47z, trixi #606,
      # trixi-bot gg-8rq.3, canapay can-x38). Path-scoped in exclusions below to
      # trixi's long-lived daemon packages. Types-aware so a `ctx.Background`
      # field can't misfire.
      analyze-types: true
      forbid:
        - pattern: '^context\.Background$'
          msg: "thread the caller/shutdown ctx; context.Background belongs only at a daemon's root (main/startup)"
    # Greenfield — tight from day one
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    nakedret:
      max-func-lines: 20
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: bare-return
          disabled: true
        - name: var-naming
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: error-return
          disabled: false
        - name: dot-imports
          disabled: false
        - name: waitgroup-by-value
          disabled: false
    depguard:
      rules:
        # depguard v2 (OpenPeeDeeP/depguard) matches `pkg` by path PREFIX, not glob:
        # a bare prefix like `.../persistence/store` already denies the package AND
        # every subpackage (`.../persistence/store/search`, etc). A trailing `/**`
        # is taken literally — no import path starts with `…/store/**`, so a `/**`
        # deny entry is a SILENT no-op. (Verified: depguard's own testdata denies
        # `compress` and catches `compress/gzip`.) Use bare prefixes only.
        #
        # NOTE: there is deliberately no agent-core-no-store rule. Agent core
        # imports persistence/store directly (agent.go, briefing.go,
        # cost_budget.go); the old local-interface seam is gone, so the
        # "agent core must not import store" architecture is no longer held.
        # Removed in trixi-w3r3 (dk decision 2026-06-07) rather than enforce a
        # dead, stale-path constraint.
        # Shell executor: graph + agent only, no store. (Verified clean.)
        agent-shell-no-store:
          files:
            - "**/agent/shell/*.go"
            - "!$test"
          deny:
            - pkg: "github.com/dkoosis/trixi/persistence/store"
              desc: "shell must not import store (prefix covers all store subpackages)"
        # Telemetry is a leaf — no trixi imports. (Verified clean.)
        agent-telemetry-leaf:
          files:
            - "**/agent/telemetry/*.go"
            - "!$test"
          deny:
            - pkg: "github.com/dkoosis/trixi"
              desc: "telemetry is a dependency leaf (prefix denies all trixi packages)"
        # NOTE: there is deliberately no kg-nugops-no-store rule. No kg/nugops
        # package exists (kg has context/, memory/, pack/), so the old rule
        # matched nothing. Removed in trixi-w3r3 (dk decision 2026-06-07);
        # re-add against the real package path if nugops is reintroduced.
        # store/search and store/index must not cross-import. (Verified clean.)
        store-no-circular:
          files:
            - "**/store/search/*.go"
            - "!$test"
          deny:
            - pkg: "github.com/dkoosis/trixi/persistence/store/index"
              desc: "search must not import index (no circular)"
        # go-workflows engine types are confined to workflow/internal/gwf.
        # The Runner seam and activities use only context.Context + trixi types,
        # so swapping the engine (e.g. to Hatchet) rewrites one package.
        #
        # NB: depguard matches `pkg` by path PREFIX — `/**` and `/*` globs are
        # silently ignored (taken literally), so the leak surface is enumerated
        # as bare prefixes. Each entry below also covers its subpackages. If a new
        # top-level go-workflows package is used inside internal/gwf, add its
        # prefix here so an accidental import elsewhere is still caught.
        workflow-engine-isolation:
          files:
            - "**/workflow/**"
            - "!**/workflow/internal/gwf/**"
          deny:
            - pkg: "github.com/cschleiden/go-workflows/workflow"
              desc: "go-workflows types must not escape internal/gwf (Hatchet swap = one file)"
            - pkg: "github.com/cschleiden/go-workflows/client"
              desc: "go-workflows client must not escape internal/gwf"
            - pkg: "github.com/cschleiden/go-workflows/worker"
              desc: "go-workflows worker must not escape internal/gwf"
            - pkg: "github.com/cschleiden/go-workflows/backend"
              desc: "go-workflows backend must not escape internal/gwf"
            - pkg: "github.com/cschleiden/go-workflows/backend/sqlite"
              desc: "go-workflows sqlite backend must not escape internal/gwf"
            - pkg: "github.com/cschleiden/go-workflows/core"
              desc: "go-workflows core types must not escape internal/gwf"
            - pkg: "github.com/cschleiden/go-workflows/activity"
              desc: "go-workflows activity helpers must not escape internal/gwf"
            - pkg: "github.com/cschleiden/go-workflows/registry"
              desc: "go-workflows registry must not escape internal/gwf"
        recipe-engine-isolation:
          files:
            - "**/recipe/**"
          deny:
            - pkg: "github.com/cschleiden/go-workflows"
              desc: "recipe is the engine-agnostic Model; go-workflows must stay in modules/workflow/internal/gwf"
            - pkg: "github.com/dkoosis/trixi/workflow"
              desc: "recipe must not import the execution seam (no back-edge); workflow depends on recipe, never the reverse"
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files: relax security, complexity, and context requirements
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: _test\.go
      - linters:
          - noctx
        path: _test\.go
      - linters:
          - unparam
        path: _test\.go
      # wrapcheck: test files wrap nothing meaningful — boundary wrapping is a
      # production-code concern (trixi-u6q)
      - linters:
          - wrapcheck
        path: _test\.go
      # internal/context: package name intentionally matches directory
      - linters:
          - revive
        path: internal/context/
        text: var-naming
      # cmd main.go: relax complexity
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: cmd/.*/main\.go
      # cmd/trixi: cobra init() is the idiomatic registration pattern
      # (path remapped from app/cmd/trixi/ in the single-module collapse).
      - linters:
          - gochecknoinits
        path: cmd/trixi/
      # ── Collapse-unmasked latent lint (trixi-module-collapse) ──
      # These were lint-clean pre-collapse only because of module boundaries /
      # per-module go versions; `./...` under one go 1.26 module surfaces them.
      # Suppressed here to keep PR 1 a behavior-neutral mechanical lift — the
      # underlying code fixes are deferred to PR 2 (no Go-logic edits in PR 1).
      # modernize newexpr (ptr(x)→new(x)) is only valid under go 1.26; surfaces
      # in observe/metrics test helpers after the go-version unification.
      - linters:
          - modernize
        path: _test\.go
      # musttag now resolves the cross-package struct (kinds.go + a cmd/trixi
      # test) that module boundaries previously hid. PR 2: add the json tags.
      - linters:
          - musttag
        path: cmd/trixi/
      # internal/treecheck was never in the pre-collapse MODULES lint gate, so
      # its two filepath.Rel/WalkDir wrapcheck findings were never reported.
      # PR 2: wrap the errors or keep this carve-out.
      - linters:
          - wrapcheck
        path: internal/treecheck/
      - linters:
          - gocritic
        path: cmd/.*/main\.go
        text: exitAfterDefer
      # bugclasses rule 5 (forbidigo Background ban) is noise everywhere except
      # long-lived daemon request/goroutine handling. context.Background is
      # legitimate at trixi's roots — every cmd/ CLI entrypoint (each command is
      # its own short-lived root), the DB bootstrap/migration path (runs once at
      # startup), and the conformance-test helper packages (*test/ + testutil,
      # test fixtures that aren't _test.go). Scope the ban away from those.
      - linters:
          - forbidigo
        path: '(_test\.go$|(^|/)cmd/|(^|/)main\.go$|/storetest/|/embeddertest/|/workflowtest/|/testutil/|/migrations\.go$|/schema_version\.go$)'
        text: 'context\.Background'
      # bugclasses rule 5, second scope: daemon subsystems whose Background use
      # is architecturally deliberate, not a severed request ctx —
      #   - agent/shell: the persistent agent_shell subsystem spawns bash
      #     processes and sessions that MUST outlive the spawning request's ctx
      #     (bgjob.go documents this: "the child must not die when the spawning
      #     request's context ends").
      #   - agent/supervisor: daemon lifecycle + graceful shutdown; its bounded
      #     contexts run AFTER the root ctx is cancelled by design (gh-751).
      # agent/mcp/bridge/store_kg.go was scoped out here until tx-v8hz threaded
      # ctx through the KG interface; the adapter now takes the caller's ctx, so
      # the exemption is gone and forbidigo guards that boundary again.
      # The request/query path (agent loop, llm, prompt, kg queries) stays armed.
      - linters:
          - forbidigo
        path: '((^|/)internal/agent/shell/|(^|/)internal/agent/supervisor/)'
        text: 'context\.Background'
      # Protobuf generated
      - linters:
          - cyclop
          - errcheck
          - funlen
          - gocyclo
          - nestif
          - staticcheck
        path: \.pb\.go
    paths:
      - third_party$
      - examples$
      - tools/ # one-shot migration CLIs — wrapcheck out of scope (trixi-u6q)

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - examples$
